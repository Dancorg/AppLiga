name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Create database schema
        run: |
          mysql -h 127.0.0.1 -u root -ptestpassword testdb <<'SQL'
          CREATE TABLE sc_users (
            user_id int NOT NULL AUTO_INCREMENT,
            name varchar(50) DEFAULT NULL,
            role varchar(50) DEFAULT NULL,
            score int DEFAULT NULL,
            email varchar(255) NOT NULL,
            password varchar(255) NOT NULL,
            created_at timestamp NULL DEFAULT CURRENT_TIMESTAMP,
            PRIMARY KEY (user_id),
            UNIQUE KEY email (email)
          );
          CREATE TABLE leagues (
            league_id int NOT NULL AUTO_INCREMENT,
            name varchar(100) DEFAULT NULL,
            hit_head int DEFAULT 3,
            hit_torso int DEFAULT 2,
            hit_arm int DEFAULT 1,
            hit_legs int DEFAULT 1,
            scoring_mode varchar(20) DEFAULT 'total',
            allow_ties tinyint(1) DEFAULT 1,
            PRIMARY KEY (league_id)
          );
          CREATE TABLE tournaments (
            tourney_id int NOT NULL AUTO_INCREMENT,
            name varchar(100) DEFAULT NULL,
            hit_head int DEFAULT 3,
            hit_torso int DEFAULT 2,
            hit_arm int DEFAULT 1,
            hit_legs int DEFAULT 1,
            scoring_mode varchar(20) DEFAULT 'total',
            allow_ties tinyint(1) DEFAULT 1,
            players_advance int DEFAULT 2,
            status varchar(20) DEFAULT 'open',
            PRIMARY KEY (tourney_id)
          );
          CREATE TABLE tournament_enrollments (
            id int NOT NULL AUTO_INCREMENT,
            tourney_id int DEFAULT NULL,
            user_id int DEFAULT NULL,
            PRIMARY KEY (id),
            UNIQUE KEY unique_tourney_user (tourney_id, user_id),
            CONSTRAINT te_tourney_fk FOREIGN KEY (tourney_id) REFERENCES tournaments (tourney_id),
            CONSTRAINT te_user_fk FOREIGN KEY (user_id) REFERENCES sc_users (user_id) ON DELETE CASCADE
          );
          CREATE TABLE tournament_pools (
            pool_id int NOT NULL AUTO_INCREMENT,
            tourney_id int DEFAULT NULL,
            pool_number int DEFAULT NULL,
            PRIMARY KEY (pool_id),
            CONSTRAINT tp_tourney_fk FOREIGN KEY (tourney_id) REFERENCES tournaments (tourney_id)
          );
          CREATE TABLE pool_members (
            id int NOT NULL AUTO_INCREMENT,
            pool_id int DEFAULT NULL,
            user_id int DEFAULT NULL,
            PRIMARY KEY (id),
            CONSTRAINT pm_pool_fk FOREIGN KEY (pool_id) REFERENCES tournament_pools (pool_id),
            CONSTRAINT pm_user_fk FOREIGN KEY (user_id) REFERENCES sc_users (user_id) ON DELETE CASCADE
          );
          CREATE TABLE elim_rounds (
            round_id int NOT NULL AUTO_INCREMENT,
            tourney_id int DEFAULT NULL,
            round_number int DEFAULT NULL,
            round_name varchar(50) DEFAULT NULL,
            PRIMARY KEY (round_id),
            CONSTRAINT er_tourney_fk FOREIGN KEY (tourney_id) REFERENCES tournaments (tourney_id)
          );
          CREATE TABLE elim_slots (
            slot_id int NOT NULL AUTO_INCREMENT,
            round_id int DEFAULT NULL,
            slot_number int DEFAULT NULL,
            advances_to_slot_id int DEFAULT NULL,
            player1_id int DEFAULT NULL,
            player2_id int DEFAULT NULL,
            winner_id int DEFAULT NULL,
            PRIMARY KEY (slot_id),
            CONSTRAINT es_round_fk FOREIGN KEY (round_id) REFERENCES elim_rounds (round_id),
            CONSTRAINT es_advances_fk FOREIGN KEY (advances_to_slot_id) REFERENCES elim_slots (slot_id)
          );
          CREATE TABLE dates (
            date_id int NOT NULL AUTO_INCREMENT,
            league_id int DEFAULT NULL,
            date_number int DEFAULT NULL,
            date_date date DEFAULT NULL,
            PRIMARY KEY (date_id),
            KEY date_ibfk_1 (league_id),
            CONSTRAINT date_ibfk_1 FOREIGN KEY (league_id) REFERENCES leagues (league_id) ON DELETE CASCADE
          );
          CREATE TABLE enrollments (
            id int NOT NULL AUTO_INCREMENT,
            user_id int DEFAULT NULL,
            league_id int NOT NULL,
            PRIMARY KEY (id),
            UNIQUE KEY unique_user_league (user_id, league_id),
            KEY enrollments_ibfk_2 (league_id),
            CONSTRAINT enrollments_ibfk_2 FOREIGN KEY (league_id) REFERENCES leagues (league_id) ON DELETE CASCADE,
            CONSTRAINT fk_enrolluserid FOREIGN KEY (user_id) REFERENCES sc_users (user_id) ON DELETE CASCADE
          );
          CREATE TABLE matches (
            id int NOT NULL AUTO_INCREMENT,
            date_id int DEFAULT NULL,
            pool_id int DEFAULT NULL,
            elim_slot_id int DEFAULT NULL,
            PRIMARY KEY (id),
            KEY matches_ibfk_1 (date_id),
            CONSTRAINT matches_ibfk_1 FOREIGN KEY (date_id) REFERENCES dates (date_id) ON DELETE CASCADE,
            CONSTRAINT matches_pool_fk FOREIGN KEY (pool_id) REFERENCES tournament_pools (pool_id),
            CONSTRAINT matches_slot_fk FOREIGN KEY (elim_slot_id) REFERENCES elim_slots (slot_id)
          );
          CREATE TABLE matchplayers (
            id int NOT NULL AUTO_INCREMENT,
            user_id int DEFAULT NULL,
            match_id int DEFAULT NULL,
            PRIMARY KEY (id),
            KEY fk_matchuserid (user_id),
            KEY matchplayers_ibfk_2 (match_id),
            CONSTRAINT fk_matchuserid FOREIGN KEY (user_id) REFERENCES sc_users (user_id) ON DELETE CASCADE,
            CONSTRAINT matchplayers_ibfk_2 FOREIGN KEY (match_id) REFERENCES matches (id) ON DELETE CASCADE
          );
          CREATE TABLE participations (
            id int NOT NULL AUTO_INCREMENT,
            user_id int DEFAULT NULL,
            date_id int DEFAULT NULL,
            PRIMARY KEY (id),
            UNIQUE KEY user_id (user_id, date_id),
            KEY participations_ibfk_2 (date_id),
            CONSTRAINT fk_partuserid FOREIGN KEY (user_id) REFERENCES sc_users (user_id) ON DELETE CASCADE,
            CONSTRAINT participations_ibfk_2 FOREIGN KEY (date_id) REFERENCES dates (date_id) ON DELETE CASCADE
          );
          CREATE TABLE scores (
            id int NOT NULL AUTO_INCREMENT,
            user_id int DEFAULT NULL,
            match_id int DEFAULT NULL,
            score int DEFAULT NULL,
            PRIMARY KEY (id),
            KEY fk_userid (user_id),
            KEY scores_ibfk_2 (match_id),
            CONSTRAINT fk_userid FOREIGN KEY (user_id) REFERENCES sc_users (user_id) ON DELETE CASCADE,
            CONSTRAINT scores_ibfk_2 FOREIGN KEY (match_id) REFERENCES matches (id) ON DELETE CASCADE
          );
          SQL

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Start backend
        working-directory: backend
        env:
          EXPRESS_PORT: 3000
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: testpassword
          MYSQL_DATABASE: testdb
          JWT_SECRET: testsecret
        run: node src/index.js &

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend/app-liga-front

      - name: Build frontend
        run: npm run build
        working-directory: frontend/app-liga-front
        env:
          VITE_API_BASE: /api

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: .

      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:3000 --timeout 15000

      - name: Run Playwright tests
        run: npx playwright test
        env:
          API_BASE: http://localhost:3000/api
          FRONTEND_URL: http://localhost:3000

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
